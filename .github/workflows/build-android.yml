name: Build Android APK

# Builds a sideloadable, non-Play-Store .apk of the Android app on every
# push and PR, and on demand. GitHub's hosted Ubuntu runners already have
# the Android SDK and full internet access preinstalled, which is exactly
# what's needed here and what a locked-down sandbox environment may not
# have -- see android/README-BUILD.md for the full picture of why this
# workflow exists as an alternative to building locally.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install web app dependencies
        run: npm ci

      - name: Build the web app (dist/)
        run: npm run build

      - name: Sync into the native Android project
        run: npx cap copy android

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: arabic-reader-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
