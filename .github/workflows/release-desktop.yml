name: Release desktop app

# Builds the Windows installer and publishes it as a GitHub Release. Installed
# copies of the app find new releases on their own (electron/autoUpdate.cjs).
#
# To ship: bump "version" in package.json, merge to main, then push a matching
# tag:  git tag v0.65.0 && git push origin v0.65.0
on:
  push:
    tags: ['v*']
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Check the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          if [ "v$(node -p "require('./package.json').version")" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version"; exit 1
          fi

      # electron-builder uploads files in parallel and, when no release exists yet,
      # the uploads race to create it (leaving a draft with missing files). Creating
      # it first, already published, avoids that and keeps the updater able to see it.
      - name: Create the release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes "See CHANGELOG.md." --verify-tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish the installer
        run: npm run build && npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
