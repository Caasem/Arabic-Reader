<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#9c7a4f" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Arabic Reader" />
    <!-- iOS ignores the web manifest for "Add to Home Screen" -- these meta
         tags are what actually make it install as a standalone app there
         instead of just bookmarking a Safari tab. black-translucent draws
         content under the status bar; safe-area insets are already handled
         elsewhere (see the notch/home-indicator fix), so this is safe. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Arabic Reader</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
